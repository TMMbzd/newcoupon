# CI（第 1 环建、第 2 环修正时区）——构建 + 全量测试质量门
#
# 修正记录（2026-10-12）：CI 首跑 7 例失败，根因两类——
# ① 时区差异（2 例）：GitHub Actions 默认 UTC，测试假设 Asia/Shanghai
#    → 修：设 TZ 环境变量 + JVM 参数 -Duser.timezone=Asia/Shanghai
# ② CI 资源差异（5 例）：免费 runner（2核7G）比本地更紧张，巡检/定时任务
#    在时间窗口内没跑完 → 暂不修（观察修正时区后的余量），如持续失败再排查
#
# 分支保护规则（GitHub 仓库设置手动配置）：
#   main 分支：Require PR + Require status checks

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  TZ: Asia/Shanghai

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run full test suite
        run: mvn clean test -B -Duser.timezone=Asia/Shanghai

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
