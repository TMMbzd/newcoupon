# CI 最小版（第 1 环 1-2 项）——构建 + 全量测试两道质量门
#
# 触发：push 到 main 或针对 main 的 PR
# 环境：Ubuntu（自带 Docker——Testcontainers 需要）
# 缓存：Maven 仓库（actions/setup-java 内置 maven 缓存）
# 超时：30 分钟（全量测试本地约 8 分钟，CI 留余量）
#
# 分支保护规则（GitHub 仓库设置里手动配置，不在此文件中）：
#   - main 分支：要求 CI 通过才能合并
#   - PR 必须至少 1 人审核
#
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run full test suite
        run: mvn clean test -B

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
