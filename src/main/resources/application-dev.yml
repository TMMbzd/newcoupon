# dev 环境配置：本地 docker compose 起的 MySQL/Redis
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/newcoupon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: root123456
    hikari:
      # 连接池就是"库存"：池子打满后所有请求排队等连接——容量参数必须显式声明而不是用默认值
      maximum-pool-size: 20        # 阶段0单机足够；上线前按压测调整（参考：连接数 < MySQL max_connections 的 60%）
      minimum-idle: 5
      connection-timeout: 3000     # 3s 拿不到连接快速失败，宁可报错也不堆积线程
      max-lifetime: 1800000

  data:
    redis:
      host: localhost      # docker compose 的 newcoupon-redis
      port: 6379
      timeout: 1s          # Redis 闸门超时快速失败：宁可走降级路径也不拖长领券RT
      lettuce:
        pool:
          max-active: 50   # 与 MySQL 连接池同量级思考：池=并发上限，打满则请求排队
          max-idle: 10

# dev 环境 SQL 直打控制台：==> Preparing 是 SQL 模板，==> Parameters 是实参，<== Total 是返回行数——
# 排障第一手资料。仅 dev 打开：生产环境的 SQL 观测走慢日志与审计（控制台全量打印量太大且有泄露风险）。
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# dev 便利：本地管理面令牌（生产靠 ADMIN_TOKEN 环境变量；空=拒绝所有管理写，fail-closed）
# L38 修复（评审 P1-12）：该值原先是 application.yml 的默认值，使 fail-closed 形同虚设——挪到这里。
coupon:
  admin:
    token: dev-admin-token
  # S1 开放平台：接入方密钥（SK）的加密主密钥（Base64 的 32 字节 = AES-256）。
  # **只在 dev 有默认值**：生产必须用环境变量 OPEN_SECRET_MASTER_KEY 注入——
  # application.yml 里该配置默认为空，SecretCipher 遇到空值直接启动失败（fail-fast）：
  # 静默用一个内置默认密钥，等于"所有人拿到代码就能解开你库里的 SK"。
  # 教训（2026-10-01 实测）：fail-fast 的代价是"所有没配这个值的环境都起不来"——
  # 新增的必填配置必须同批更新每一套环境，否则本地开发会当场炸（被 P2cAdminAuthTest 抓出）。
  open:
    secret-master-key: ${OPEN_SECRET_MASTER_KEY:KcRJ6SHXoWwxU2BdyAv7tahGxVJPzzS4ynA4ixVIxcA=}
