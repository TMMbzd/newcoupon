# 公共配置（环境无关的部分）；环境差异放 application-{profile}.yml
spring:
  application:
    name: newcoupon-server
  profiles:
    active: dev          # 本地开发默认 dev；生产用启动参数 --spring.profiles.active=prod 覆盖

  # SQL 版本化（ADR-0002）由 ShardingDataSourceConfig **手工触发**（不用 Boot 自动装配）：
  # 分片数据源构造前必须先跑完 V1-V6（192 张物理分表），Boot 的 Flyway 自动装配
  # 与自定义 DataSource 存在循环依赖——实测踩坑，改为代码内显式时序
  flyway:
    enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # R7（ADR-0008）：@Scheduled 默认单线程调度池——多个定时任务互相会排队饿死，逐步扩容
  # （库存巡检/库存日审/过期扫描/过期日审 + L5 锁定超时扫描/超时审计 = 3→4）
  task:
    scheduling:
      pool:
        size: 4

server:
  port: 8080
  # 优雅停机：收到 SIGTERM 后先停止接新请求，等在途请求完成（最多30s）再退出。
  # 没有它，每次发版都会切断在途领券/核销请求，制造出一批"扣了库存没落库"的不一致。
  shutdown: graceful

# ShardingSphere 真实库连接（dev 默认本机 compose；测试容器由 DynamicPropertySource 注入；
# 生产用环境变量覆盖）。业务数据源=ShardingSphere 驱动（分片路由见 ShardingDataSourceConfig）
coupon:
  sharding:
    url: jdbc:mysql://127.0.0.1:3306/newcoupon?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}
    sql-show: false
  id:
    worker-id: ${WORKER_ID:1}
  # L5 锁定超时窗口（分钟）：与订单域支付超时契约对齐（订单超时取消=券超时收场，两边同步死）
  trade:
    lock-timeout-minutes: ${LOCK_TIMEOUT_MINUTES:30}
  # ADR-0009 守恒对账：修复模式 force|shadow（影子=推导落表不执行，v3 修订8 先行 1-2 周）
  reconcile:
    auto-repair:
      mode: ${REPAIR_MODE:shadow}
    transient-burst-threshold: 500
  # 风控前置最小版（docs/11 §6）：IP 频控固定窗口——挡脚本高频领券；fail-open
  risk:
    ip-rate:
      enabled: true
      window-seconds: 60
      max-per-window: 30

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境打印 SQL 走慢日志/审计，不在这里；dev 由 logging.level 控制可见性
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info     # 最小暴露原则：只开健康检查，不多暴露一个端点
  endpoint:
    health:
      show-details: never        # 健康详情不对外暴露（含中间件拓扑，属于敏感信息）

logging:
  level:
    root: INFO
    com.newcoupon: DEBUG         # 开发期自己的包开 DEBUG，生产改 INFO

# XXL-JOB（ADR-0010 调度平台）：默认关闭——测试与无调度中心环境走 @Scheduled 降级通道；
# 生产/compose 启动置 XXL_JOB_ENABLED=true（accessToken 必须与调度中心一致）
xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false}
    adminAddresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8280/xxl-job-admin}
    appname: newcoupon-executor
    port: 9999
    accessToken: default_token
    logPath: /tmp/xxl-job/log
