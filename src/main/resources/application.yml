# 公共配置（环境无关的部分）；环境差异放 application-{profile}.yml
spring:
  application:
    name: newcoupon-server
  profiles:
    active: dev          # 本地开发默认 dev；生产用启动参数 --spring.profiles.active=prod 覆盖

  # SQL 版本化（ADR-0002）由 ShardingDataSourceConfig **手工触发**（不用 Boot 自动装配）：
  # 分片数据源构造前必须先跑完 V1-V6（192 张物理分表），Boot 的 Flyway 自动装配
  # 与自定义 DataSource 存在循环依赖——实测踩坑，改为代码内显式时序
  flyway:
    enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # R7（ADR-0008）：@Scheduled 默认单线程调度池——多个定时任务互相会排队饿死，逐步扩容
  # （库存巡检/库存日审/过期扫描/过期日审 + L5 锁定超时扫描/超时审计 = 3→4）
  task:
    scheduling:
      pool:
        size: 4

server:
  port: 8080
  # 优雅停机：收到 SIGTERM 后先停止接新请求，等在途请求完成（最多30s）再退出。
  # 没有它，每次发版都会切断在途领券/核销请求，制造出一批"扣了库存没落库"的不一致。
  shutdown: graceful
  # 客户端 IP 的**信任边界交给容器**（Tomcat RemoteIpValve），应用层只读 getRemoteAddr()。
  #
  # 为什么不是应用自己解析 X-Forwarded-For：那个头由请求方决定。取它的"首跳"= 谁都能换一个
  # 假地址换一个干净的限流桶（按 IP 的限流形同虚设），审计里的来源 IP 也变成攻击者写的字符串
  # （Spring Cloud Gateway 官方文档把这个反模式点名成 "vulnerable to spoofing"）。
  # 阀门的规则才是对的：① 只在"直连对端是可信代理"时才看这些头（公网直连伪造无效）；
  # ② **从右往左**跳过内部/可信跳、取第一个不可信的（代理一般往右追加真实来源）。
  # 这样"Nginx 是覆盖还是追加代理头"就不再是安全前提——两种写法都能拿到真实客户端。
  #
  # 关于 internal-proxies：**保持 Spring Boot 的默认值**（私网 + 127/8，含 IPv6 环回），
  # 即"来自本机/私网的直连对端算可信代理"。注意两件事：
  #   · 不要把这里配成空——Boot 文档说"置空=信任所有代理"，但代码里是让**整个阀门失效**
  #     （文档与实现不符，实测过），表现为所有客户端塌缩成代理 IP 一个限流键；
  #   · **生产应收窄成"代理→应用"的实际来源**（同机 Nginx 就是 127\.0\.0\.1，否则填网段），
  #     这属于部署前置条件，写进 docs/11 与 STATUS——仓库里无法验证运维实际用的是哪个地址。
  # 另外：阀门按 X-Forwarded-Proto/Port/Host 改写 scheme/端口/主机名（同样只在可信对端时），
  # 这是反代后应有的行为；若哪天不希望它改动，把对应 header 名指到一个永不出现的头名上
  # （用空值关不掉——Boot 会把空值替换回默认头名）。
  forward-headers-strategy: native

# ShardingSphere 真实库连接（dev 默认本机 compose；测试容器由 DynamicPropertySource 注入；
# 生产用环境变量覆盖）。业务数据源=ShardingSphere 驱动（分片路由见 ShardingDataSourceConfig）
coupon:
  # 运行时配置校验（Phase 1）：启动时核对 JVM/MySQL/账单日时区、连接数预算、XXL 多实例参数。
  # strict-config 留空 = active profile 含 prod 时严格（校验失败阻止启动），否则只 WARN。
  runtime:
    strict-config: ${RUNTIME_STRICT_CONFIG:}
    expected-instances: ${EXPECTED_INSTANCES:1}
    instances-per-host: ${INSTANCES_PER_HOST:1}
    mysql-safety-connections: ${MYSQL_SAFETY_CONNECTIONS:20}
    mysql-max-utilization: ${MYSQL_MAX_UTILIZATION:0.8}
  # 缓存跨实例失效（Phase 1）：pub/sub 即时通知 + 版本键轮询兜底 + TTL 最终上界。
  # enabled=false 退回纯本地失效（排查 pub/sub 干扰时用）；instance-id 需每个 JVM 唯一。
  cache:
    invalidation:
      enabled: ${CACHE_INVALIDATION_ENABLED:true}
      channel: ${CACHE_INVALIDATION_CHANNEL:c:cache:invalidate}
      poll-ms: ${CACHE_INVALIDATION_POLL_MS:5000}
      instance-id: ${INSTANCE_ID:${random.uuid}}
  sharding:
    url: jdbc:mysql://127.0.0.1:3306/newcoupon?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}
    sql-show: false
  # C1 是唯一库存模型（旧 Redis 桶链路已删除）；分片数只影响新模板的布局。
  stock:
    shard-count: ${STOCK_SHARD_COUNT:16}
  # ADR-0019 异步发放：默认全关；allowlist 为空时拒绝启动异步入口（防止误开全量）。
  # async-template-ids 支持逗号分隔的模板 id，或 "*" 表示全部（仅测试/内部灰度）。
  issue:
    async-enabled: ${ISSUE_ASYNC_ENABLED:false}
    async-template-ids: ${ISSUE_ASYNC_TEMPLATE_IDS:}
    idem-ttl-seconds: ${ISSUE_IDEM_TTL_SECONDS:604800}
    day-ttl-seconds: ${ISSUE_DAY_TTL_SECONDS:172800}
    gate:
      # Redis 连接/超时：reject=返回可重试 5001；db-fallback=只写 WAL 返回 202（worker DB 终审）
      redis-down-policy: ${ISSUE_GATE_REDIS_DOWN_POLICY:reject}
    # V36：请求路径没修成的 gate/计数问题登记到数据库，由后台任务单飞修复。
    gate-repair:
      fixed-delay-ms: ${ISSUE_GATE_REPAIR_FIXED_DELAY_MS:5000}
      initial-delay-ms: ${ISSUE_GATE_REPAIR_INITIAL_DELAY_MS:5000}
      batch-size: ${ISSUE_GATE_REPAIR_BATCH_SIZE:50}
      lease-seconds: ${ISSUE_GATE_REPAIR_LEASE_SECONDS:30}
      max-attempts: ${ISSUE_GATE_REPAIR_MAX_ATTEMPTS:8}
      cleanup-cron: ${ISSUE_GATE_REPAIR_CLEANUP_CRON:0 23 4 * * ?}
    worker:
      enabled: ${ISSUE_ASYNC_WORKER_ENABLED:false}
      # 同一实例内并行处理已领取任务：单任务一事务，并行让 InnoDB group commit 摊薄 fsync；
      # 领取仍由 SKIP LOCKED + lease 串行/跨实例协调。默认 4，按压测调。
      parallelism: ${ISSUE_ASYNC_WORKER_PARALLELISM:4}
      # 每个批量事务合并多少条任务：一事务一次提交。日限/重复用户等场景自动退回逐条。
      batch-tx-size: ${ISSUE_ASYNC_WORKER_BATCH_TX_SIZE:50}
      # 按库存分片分组后的并行事务数：不同分片组各锁一行，可同时提交。
      group-parallelism: ${ISSUE_ASYNC_WORKER_GROUP_PARALLELISM:16}
      # 裸 JDBC 物理表批量写：只适配当前 1 物理库 × 64 表；拆物理库时置 false 回退 ShardingSphere。
      raw-bulk-enabled: ${ISSUE_ASYNC_WORKER_RAW_BULK_ENABLED:true}
      raw-bulk-pool-size: ${ISSUE_ASYNC_WORKER_RAW_BULK_POOL_SIZE:4}
    # 任务/计数保留：只删终态任务（SUCCESS/REJECTED/DEAD），PENDING/PROCESSING 永不删。
    retention-days: ${ISSUE_TASK_RETENTION_DAYS:7}
    counter-retention-days: ${ISSUE_COUNTER_RETENTION_DAYS:90}
    cleanup-cron: ${ISSUE_TASK_CLEANUP_CRON:0 17 4 * * ?}
  # 批量发放任务域（V6 阶段 1A）。worker 默认关：受理端点常开，执行端按环境显式打开——
  # 没有这个条目时 @ConditionalOnProperty 静默不装配，任务受理后永远 PENDING 且无任何提示。
  grant:
    worker:
      enabled: ${GRANT_WORKER_ENABLED:false}
      fixed-delay-ms: ${GRANT_WORKER_FIXED_DELAY_MS:5000}
      initial-delay-ms: ${GRANT_WORKER_INITIAL_DELAY_MS:10000}
  # 兑换码域（V6 阶段 1B）。
  code:
    # 码哈希的 HMAC pepper：生产必须用环境变量 CODE_PEPPER 注入（dev 默认值会打启动告警）。
    # **换了 pepper = 全部存量码作废**（哈希对不上），只能在新库/清库后更换。
    pepper: ${CODE_PEPPER:dev-only-coupon-code-pepper-2026}
    # LOCKED 残留独立回收调度（默认关）：grant worker 开着的环境由 worker 每轮顺带回收，
    # 只有"没开 grant worker 但用兑换码"的部署需要单独打开，否则崩窗残留码无人回收。
    reap-enabled: ${CODE_REAP_ENABLED:false}
  # 营销活动与预算闸门（V6 阶段 1C）。预算的一切都挂在活动级 budget_enabled=1 之后：
  # 活动不开预算，发放链路不多一条 SQL、行为与 1C 之前完全一致（回滚承诺）。
  activity:
    # 建券时校验 activityId 真实存在且归属一致（默认 false：存量测试/调用方的
    # activityId 多为字面量，直接开会全部被拒；新部署建议开）。
    check-enabled: ${ACTIVITY_CHECK_ENABLED:false}
    # 预算开关判断的本地缓存 TTL：开启/关闭预算最多延迟这个时长生效（对闸门两个
    # 方向都是安全侧——晚开=少拦，晚关=多拦，都不会超发钱）。
    cache-ttl-ms: ${ACTIVITY_CACHE_TTL_MS:30000}
  budget:
    # 单人领取/兑换码预占的存活时长（分钟）：覆盖一次请求的完整收口；崩窗残留由
    # grant worker 每轮的僵尸预占回收兜底。
    single-ttl-minutes: ${BUDGET_SINGLE_TTL_MINUTES:10}
    # 批量 chunk 预占的存活时长（分钟）：定时任务的锚点=定时开始时间+TTL，
    # 保证任务开跑前预占不会先过期回池（默认 24h）。
    chunk-ttl-minutes: ${BUDGET_CHUNK_TTL_MINUTES:1440}
    # 僵尸预占每批扫描条数（回收循环的批大小）。
    expire-batch-size: ${BUDGET_EXPIRE_BATCH_SIZE:200}
    # 预算与发放对账任务（默认关，照 GrantTaskWorker 的开关纪律）：四条等式
    # （账本=账户 / 开口守恒 / 码池守恒 / 任务守恒），差异落 stock_drift_log 只告警不修复。
    reconcile:
      enabled: ${BUDGET_RECONCILE_ENABLED:false}
      fixed-delay-ms: ${BUDGET_RECONCILE_FIXED_DELAY_MS:3600000}
      initial-delay-ms: ${BUDGET_RECONCILE_INITIAL_DELAY_MS:3600000}
      code-batch-limit: ${BUDGET_RECONCILE_CODE_BATCH_LIMIT:1000}
  id:
    # 空=启动时在 Redis 抢一个 0-1023 的 workerId 租约；显式 WORKER_ID 仍优先，但必须唯一。
    worker-id: ${WORKER_ID:}
  # Redis 运行数据采集：内存/淘汰/命中率/连接/复制状态，低基数指标，故障排查用。
  redis:
    info-interval-ms: ${REDIS_INFO_INTERVAL_MS:30000}
    info-initial-delay-ms: ${REDIS_INFO_INITIAL_DELAY_MS:5000}
  # L5 锁定超时窗口（分钟）：与订单域支付超时契约对齐（订单超时取消=券超时收场，两边同步死）
  trade:
    lock-timeout-minutes: ${LOCK_TIMEOUT_MINUTES:30}
    max-discount-ratio: ${MAX_DISCOUNT_RATIO:80}
    confirm-rate-per-minute: ${CONFIRM_RATE_PER_MINUTE:600}
    # 部分退款次数上限（对齐微信支付单品退款：同一笔最多 50 次）
    max-refund-times: ${MAX_REFUND_TIMES:50}
    # 一券最多退券次数（整单退款且券在有效期内才退；防“下单-退款-再用”刷券）
    max-return-times: ${MAX_RETURN_TIMES:3}
    # 整单退完且券在有效期内，是否退回待使用（租户可覆盖）
    full-refund-return-coupon: ${FULL_REFUND_RETURN_COUPON:true}
    # 环 2 价格快照：默认关，按租户灰度（trade.pricing.enabled 可覆盖）
    # ttl 默认 120 分钟；锁券时还会续期到“锁窗 + 10 分钟宽限”，见 TradeTxService
    pricing:
      enabled: ${PRICING_SNAPSHOT_ENABLED:false}
      ttl-minutes: ${PRICING_SNAPSHOT_TTL_MINUTES:120}
  # 价格快照清理（过期置空 live_digest；历史行保留 7 天后删除）
  pricing:
    cleanup-cron: ${PRICING_CLEANUP_CRON:0 17 * * * ?}
  # 环 3 主体日账单开关：默认开（纯增量新表）；关闭后只出旧模板账单，便于回滚
  billing:
    settle-party:
      enabled: ${SETTLE_PARTY_BILL_ENABLED:true}
  # ADR-0009 守恒对账：修复模式 force|shadow（影子=推导落表不执行，v3 修订8 先行 1-2 周）
  reconcile:
    auto-repair:
      mode: ${REPAIR_MODE:shadow}
    transient-burst-threshold: 500
  # 风控前置最小版（docs/11 §6）：IP 频控——挡脚本高频领券；fail-open
  # 计数实现 2026-10-08 起已从手写固定窗口迁移到统一限流器（Redis 令牌桶），
  # window-seconds 现为令牌桶的"窗口"换算基准（见 IpRateGate）
  risk:
    ip-rate:
      enabled: true
      window-seconds: 60
      max-per-window: 30
    # V6 4A 设备日限（R_DEVICE_DAILY）：同设备当日领券尝试数阈值，超阈 REJECT（7003）。
    # 计数=Redis INCR+EXPIRE（键 c:risk:dev:{appId}:{deviceId}:{yyyyMMdd}，含被拒尝试）；
    # Redis 不可用→跳过+degraded+fail-open 指标（dimension=risk_device）
    device-daily:
      max-per-day: ${RISK_DEVICE_DAILY_MAX_PER_DAY:10}
  # V6 4A 风控决策总闸的全站层（SwitchKey.RISK_DECISION，三层取值的第②层）：
  # 显式配 false 而不依赖"没配=true"的枚举默认——默认关=回归零变化（关时不写决策日志、
  # 热路径零额外 IO）；租户在 open_app_config 配 switch.risk.decision.enabled=true 逐租户灰度开
  switch:
    risk:
      decision:
        enabled: ${RISK_DECISION_ENABLED:false}
  # 管理面最小鉴权（L27）：POST /api/templates* 需 X-Admin-Token 与此一致；空=拒绝所有管理写（fail-closed）
  # L38 修复（评审 P1-12）：默认值改空——此前默认 dev-admin-token 使 fail-closed 分支不可达，
  # 未设环境变量的部署等于管理面无鉴权（发布=铸造库存额度的入口）。dev 便利值挪 application-dev.yml。
  # 生产必须用环境变量 ADMIN_TOKEN 覆盖；完整 HMAC/防重放/双人复核在 P7
  # V6 2A 起该令牌由 SecurityConfig 装配进安全链（LegacyAdminTokenAuthenticationFilter），
  # 对外语义不变；RBAC 全面接管后保留一个发布周期即删除（设计裁定）。
  admin:
    token: ${ADMIN_TOKEN:}
  # 审计查询与导出（V6 2C）。用法矩阵见 docs/runbook/审计查询.md。
  audit:
    # 导出任务：文件落 audit_export_job（一次性下载，过期惰性清理——无独立调度，低频不值得）。
    export:
      # 任务有效期（小时）：过期后不可下载，下一次受理导出时被清理。
      expire-hours: ${AUDIT_EXPORT_EXPIRE_HOURS:24}
      # 行数上限：超限任务落 FAILED（提示缩窗）——LONGTEXT 上界 4GB，先拿行数保护构建时长与库压。
      max-rows: ${AUDIT_EXPORT_MAX_ROWS:200000}
    # 哈希链巡检任务（V6 2C）：默认关，照 BudgetReconcileJob 的开关纪律——
    # 没有这个条目时 @ConditionalOnProperty 静默不装配，巡检永远不跑且无任何提示。
    verify:
      enabled: ${AUDIT_CHAIN_VERIFY_ENABLED:false}
      # @Scheduled 降级通道的轮次间隔（默认一天一轮；XXL couponAuditChainVerifyJob 是主通道，
      # 手动触发不受此值限制）。每轮全表扫描，按数据量决定开不开、跑多勤。
      fixed-delay-ms: ${AUDIT_CHAIN_VERIFY_FIXED_DELAY_MS:86400000}
      initial-delay-ms: ${AUDIT_CHAIN_VERIFY_INITIAL_DELAY_MS:3600000}
  # 管理面安全（V6 2A）：种子管理员 / actuator Basic / 登录锁定 / 会话时长 / 2A-2 读面翻面开关。
  # 完整说明见 docs/research-2026-10-21/01 §4 2A 与 SecurityConfig/SessionConfig；
  # 2A-2 破坏性变更公告：docs/runbook/管理面认证翻面.md。
  security:
    # 种子管理员 admin 的初始密码：仅**建号时**读取一次（已存在不覆盖——改环境变量重置密码
    # 比"固定默认密码"更危险）。公共配置留空=不建号（fail-safe）；dev 便利值在 application-dev.yml。
    seed-admin-password: ${SEED_ADMIN_PASSWORD:}
    # 2A-2 /api 读面翻面的回滚开关（2026-11-03 起，默认翻面）：true = /api、/console 所有方法
    # 都要"旧令牌或会话"；false = 回到旧行为（只有写方法要令牌，GET 匿名放行）。
    # 这是发布保险——翻面后匿名 GET 调用方全变 401，出问题先关它回旧行为；
    # **过渡开关，一个发布周期（旧令牌删除时）后一并移除**，不要当长期功能用。
    api-read-auth-enabled: ${API_READ_AUTH_ENABLED:true}
    # actuator 链的 Basic 凭据（机器凭据，与 admin_user 人肉账号分治）。
    # 留空=随机生成（等价于关掉 Basic 入口；匿名面只剩 /health /info——
    # prometheus 自 2A-2 起也要 Basic，抓取器必须配置凭据，见 runbook）。
    actuator:
      username: ${ACTUATOR_AUTH_USER:actuator}
      password: ${ACTUATOR_AUTH_PASSWORD:}
    # 登录失败锁定：窗口内连续失败 max-attempts 次锁 lock-window（Redis 计数，键 c:admin:auth:fail:*）
    login:
      max-attempts: ${ADMIN_LOGIN_MAX_ATTEMPTS:5}
      lock-window: ${ADMIN_LOGIN_LOCK_WINDOW:15m}
    # 控制台会话时长：空闲 30 分钟（Spring Session maxInactive）/ 绝对 8 小时（Refresh 过滤器核对）
    session:
      idle-timeout: ${CONSOLE_SESSION_IDLE_TIMEOUT:30m}
      absolute-timeout: ${CONSOLE_SESSION_ABSOLUTE_TIMEOUT:8h}
  # P2d 发件箱传输开关（ADR-0011）：log=日志传输（默认，测试/无MQ环境）；rocketmq=真传输
  # （compose 起 rocketmq-namesrv/broker 后切换——生产用环境变量 OUTBOX_TRANSPORT 覆盖）
  outbox:
    transport: ${OUTBOX_TRANSPORT:log}
    namesrv-addr: ${ROCKETMQ_NAMESRV:localhost:9876}
  # S1 开放平台（2026-10-01）
  open:
    # 接入方密钥（SK）的加密主密钥：Base64 的 32 字节（AES-256）。
    # 公共配置里**故意留空**——dev 的值在 application-dev.yml，生产用环境变量 OPEN_SECRET_MASTER_KEY。
    # 为空时 SecretCipher 直接启动失败（fail-fast）：不静默降级成"内置密钥"。
    secret-master-key: ${OPEN_SECRET_MASTER_KEY:}
    # 密钥轮换期（小时）：新密钥生效后旧密钥还能用多久。默认 168 = 7 天——
    # 接入方换密钥要发版/重启，一刀切会让对方在切换瞬间全线 401。
    secret-rotation-hours: ${OPEN_SECRET_ROTATION_HOURS:168}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境打印 SQL 走慢日志/审计，不在这里；dev 由 logging.level 控制可见性
  global-config:
    banner: false

# OpenAPI 契约生成（V6 2B-2，ADR-0022）：live spec 由 springdoc 从 Controller 注解生成，
# 契约测试用它对基线 docs/open-api/openapi-v1.json 做"只增不改"门禁。
springdoc:
  # 关闭**默认未分组** spec 端点（对抗审查修复项 3）：springdoc 注册了 GroupedOpenApi 之后，
  # 默认组（springdoc.enable-default-api-docs，默认 true）仍在——/api/api-docs 与
  # /api/api-docs.yaml 会输出**未过滤的全量 spec**（全部 /api 管理端点、/console 路径、
  # schema 约束），落在兜底链的 /api 认证后面，任何控制台会话无视 RBAC 细粒度都能拉。
  # 对外契约只认 open-v1 分组端点；默认组没有存在理由。
  enable-default-api-docs: false
  api-docs:
    # spec 端点挪进 /api 前缀：兜底安全链里 /api/** 的所有方法都要"旧令牌或会话"
    # （LegacyAdminTokenAuthenticationFilter，V6 2A-2 翻面）。默认路径 /v3/api-docs
    # 不属于任何安全链的受保护前缀，等于把整个 API 面的拓扑匿名裸奔。
    # 挪进来后：匿名 GET /api/api-docs/** → 401（有契约测试钉住）。
    path: /api/api-docs
    # 钉住 OAS 3.0 档（springdoc 高版本默认可切 3.1）：基线文件与 live spec 的版本声明
    # 必须可比，不随 springdoc 升级漂移。3.0 档实际渲染 "3.0.1"（springdoc 2.6 的 3.0 常量）。
    version: openapi_3_0
  # Controller 未声明 produces 时 spec 里的响应 media type 用什么。默认 */*——那是
  # "任意类型"的占位，不是真实契约（接口实际只产 JSON）；对外 spec 声明 application/json
  # 才是可消费的契约，黄金样例对拍也按它导航。（键名带 s：default-produces-media-type）
  default-produces-media-type: application/json
  swagger-ui:
    # 生产不需要交互 UI（spec 以基线文件为准）。这个开关**同时**关掉了 swagger-config 端点
    # （/api/api-docs/swagger-config，UI 的分组索引）：SwaggerConfig 资源在 springdoc 2.6 里
    # 挂在 @ConditionalOnProperty(springdoc.swagger-ui.enabled) 上——不存在
    # "springdoc.api-docs.swagger-config.enabled" 这个键（实测裁决：有无该键行为相同，
    # 字节码里也无此属性名；曾误配为死键已删）。
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # V6 2A 加 metrics（细粒度指标，含标签值——与只读的 prometheus 抓取面不同）：
        # 暴露面收在安全链上（SecurityConfig actuator 链：health/info 匿名；
        # prometheus/metrics 自 2A-2 起要 ROLE_ACTUATOR + Basic——抓取文本带标签值，
        # 不属于匿名面，抓取器按 runbook 配凭据）。
        # **未配 ACTUATOR_AUTH_PASSWORD 时 Basic 凭据随机**，等价于不可达——
        # 需要的环境再显式开。
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never        # 健康详情不对外暴露（含中间件拓扑，属于敏感信息）

logging:
  level:
    root: INFO
    com.newcoupon: DEBUG         # 开发期自己的包开 DEBUG，生产改 INFO

# XXL-JOB（ADR-0010 调度平台）：默认关闭——测试与无调度中心环境走 @Scheduled 降级通道；
# 生产/compose 启动置 XXL_JOB_ENABLED=true（accessToken 必须与调度中心一致）
xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false}
    adminAddresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8280/xxl-job-admin}
    # 多实例/多环境必须显式覆盖 appname 与 accessToken；同机多实例还必须覆盖 port 与 logPath。
    # 运行时校验（RuntimeConfigValidator）会在 prod 严格模式下拒绝默认值。
    appname: ${XXL_JOB_APPNAME:newcoupon-executor}
    port: ${XXL_JOB_PORT:9999}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    logPath: ${XXL_JOB_LOG_PATH:/tmp/xxl-job/log}
