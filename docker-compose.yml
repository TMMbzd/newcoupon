# 本地依赖环境：MySQL 8 + Redis 7 + XXL-JOB 调度中心（ADR-0010 终局技术栈）
# xxl_job 库的建表脚本只在 MySQL 卷首次初始化时自动执行；老卷补装：
#   docker exec -i newcoupon-mysql mysql -uroot -proot123456 < docker/xxl-job/tables_xxl_job.sql
# 控制台 http://127.0.0.1:8280/xxl-job-admin （admin/123456），任务定义见 ADR-0010 §3
# 用法：docker compose up -d   （数据落在 named volume，可重复启停）
# 注意：阶段0只依赖 MySQL；Redis 是阶段1（Lua 库存扣减）的预备，顺手起好。
services:
  mysql:
    image: mysql:8.0
    container_name: newcoupon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: newcoupon
      TZ: Asia/Shanghai
    # binlog 参数（V6 5C 刀 B2：binlog 归档 + PITR 的前提）——显式钉住四个值，
    # 不裸奔在 MySQL 8.0 默认上（8.0 默认 log_bin=ON/ROW/server_id=1/sync_binlog=1，
    # 但默认 binlog 文件基名是 binlog.*；这里定为 mysql-bin.*，归档脚本按它取文件）：
    #   --log-bin=mysql-bin       开 binlog，文件基名 mysql-bin.NNNNNN
    #   --binlog-format=ROW       行级（PITR 重放安全：重放的是行变更不是 SQL 文本）
    #   --server-id=1             binlog 必需（GTID 未开——单机最简配置，与生产的差距
    #                             见 scripts/backup/README.md）
    #   --sync-binlog=1           每次提交 fsync binlog（掉电不丢已提交事件；RPO 口径
    #                             里"事务提交即可恢复"靠它）
    # ⚠ 对既有容器的影响：command 变更 = 容器**重建**（docker compose up -d mysql 会
    #   recreate），不是原地升级。数据在 named volume mysql-data 里不受影响（2026-11-10
    #   实测：重建前后表数/关键行数一致，见 docs/evidence/2026-11-10-PITR演练.md §2）；
    #   但旧基名的 binlog.* 文件留在卷里不进新序列（新序列从 mysql-bin.000001 起）。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --sync-binlog=1
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/xxl-job/tables_xxl_job.sql:/docker-entrypoint-initdb.d/10-xxl-job.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: newcoupon-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]   # 配置基线见 docker/redis/redis.conf（A2）
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

  # XXL-JOB 调度中心（ADR-0010）：调度/控制台/执行留痕/分片广播。复用主 MySQL 的 xxl_job 库。
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: newcoupon-xxljob
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=root123456
        --xxl.job.accessToken=default_token
      TZ: Asia/Shanghai
    ports:
      - "8280:8080"

# ---------- P2d 阶段二：RocketMQ（ADR-0011 阶段二真传输） ----------
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: newcoupon-mqnamesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"   # WSL2 内存预算（默认 1G+ 太奢）
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: newcoupon-mqbroker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    ports:
      - "10911:10911"
      - "10909:10909"

  # ---------- V6 5B 生产化模拟刀 A：nginx 负载均衡入口 ----------
  # 默认不起（profile lbe2e）：这是滚动重启演练（scripts/stability/lb-rolling-drill.sh）
  # 专用入口——应用实例在宿主机上（不是本 compose 的服务），nginx 在容器里反代它们。
  # 起：docker compose --profile lbe2e up -d nginx   停：docker compose --profile lbe2e stop nginx
  # 容器访问宿主：host.docker.internal:host-gateway（Linux Docker 必需；
  # upstream 用 host.docker.internal:18091/18092，2026-11-10 实测可达）。
  nginx:
    image: nginx:1.27-alpine
    container_name: newcoupon-nginx
    profiles: ["lbe2e"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # ---------- V6 5C 生产化模拟刀 B1：观测栈（Prometheus + Grafana，profile observe） ----------
  # 默认不起（不带 --profile observe 时这两个服务不存在）；起停/内存预算见 ops/grafana/README.md。
  # 拓扑：应用跑在**宿主机**（make run / 演练脚本，8080），prometheus 容器经
  # host.docker.internal 抓 /actuator/prometheus——自 2A-2 起该端点要 Basic
  # （docs/runbook/管理面认证翻面.md §4），凭据经环境变量传入，不进 git：
  #   ACTUATOR_AUTH_USER / ACTUATOR_AUTH_PASSWORD —— 与应用启动时的同名变量同源。
  # prometheus.yml 用 basic_auth_password_file 引密码文件；prometheus 配置本身不支持
  # 环境变量展开，密码文件由容器启动命令从环境变量写出（见下方 command）。
  prometheus:
    image: prom/prometheus:latest   # 本机已就位 = v3.15.1；规则三件套的 promtool 校验用的就是它
    container_name: newcoupon-prometheus
    restart: unless-stopped
    profiles: ["observe"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 凭据：环境变量 ACTUATOR_AUTH_PASSWORD 优先（真实部署走它，密码不进 git）；
    # 缺省回落仓库惯例 dev 凭据 it-actuator-pass（与演练脚本/SecurityRbacIntegrationTest
    # 同款默认，见 scripts/stability/lb-rolling-drill.sh）。曾有教训（2026-11-10 B1 首跑）：
    # 若这里 default 留空，任何一次没带环境变量的 compose up 都会把容器重建成无凭据
    # 崩溃循环——缺省 dev 凭据让 `--profile observe up` 永远可跑，生产再显式覆盖。
    environment:
      ACTUATOR_AUTH_PASSWORD: ${ACTUATOR_AUTH_PASSWORD:-it-actuator-pass}
    # 镜像默认 ENTRYPOINT 是 /bin/prometheus，这里改用 sh 包装（先从环境变量写出
    # 密码文件再 exec prometheus），所以 entrypoint 必须一并覆盖
    entrypoint: ["sh", "-c"]
    command:
      - |
        printf '%s' "$${ACTUATOR_AUTH_PASSWORD:?}" > /tmp/basic-auth-password
        exec prometheus --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=15d --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/slo-recording.rules.yml:/etc/prometheus/rules/slo-recording.rules.yml:ro
      - ./ops/prometheus/slo-alerts.rules.yml:/etc/prometheus/rules/slo-alerts.rules.yml:ro
      # TSDB 落 named volume：容器重建（compose up 对配置漂移的默认动作）不丢数据——
      # 2026-11-10 B1 首跑就丢过一次取证窗口
      - prometheus-data:/prometheus
    mem_limit: 256m

  # Grafana：数据源与大盘走 provisioning（进 git 的声明式配置，容器起来即就绪，
  # 不在 UI 里手工点）——数据源 ops/grafana/provisioning/datasources/prometheus.yml，
  # 大盘 ops/grafana/slo-dashboard.json（SLO 盘，面板清单见其 README）。
  grafana:
    image: grafana/grafana:11.3.0
    container_name: newcoupon-grafana
    restart: unless-stopped
    profiles: ["observe"]
    depends_on:
      - prometheus
    environment:
      # 本地演练便利默认 admin/admin；生产/对外暴露时用 GRAFANA_ADMIN_PASSWORD 覆盖
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      # 只挂数据源/大盘两个子目录（不整目录盖掉 /etc/grafana/provisioning——
      # 那会把镜像自带的 plugins/ alerting/ 子目录遮没，启动日志报错）
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/slo-dashboard.json:/var/lib/grafana/dashboards/slo-dashboard.json:ro
    mem_limit: 256m

  # ---------- V6 5B 生产化模拟刀 C2：Jaeger（trace 后端，profile observe） ----------
  # 默认不起（与 prometheus/grafana 同 profile）；起停/内存预算/取证：docs/runbook/Tracing与E2E.md。
  # 拓扑：应用跑在宿主机（TRACING_ENABLED=true），OTLP/HTTP 导出到 127.0.0.1:4318 →
  # 这里收 trace；查证走 16686 的 UI 与 REST API（/api/traces?service=...）。
  # 选 all-in-one（单二进制全家桶：collector+storage+query+UI，内存 ~300-500MB）——
  # 单机模拟够用；生产形态（collector 分离 + ES/Cassandra 后端 + tail sampling）在
  # runbook 裁剪登记。取证完 `docker compose --profile observe stop jaeger` 释放内存。
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: newcoupon-jaeger
    restart: unless-stopped
    profiles: ["observe"]
    environment:
      # OTLP 接收口显式打开（1.43+ 默认开，显式钉住防升级漂移）
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI + REST API（取证 curl 走这里）
      - "4318:4318"     # OTLP/HTTP（应用的 TRACING_OTLP_ENDPOINT 指这里）
    mem_limit: 512m

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
