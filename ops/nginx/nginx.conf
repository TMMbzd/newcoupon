# 生产化模拟刀 A2（V6 5B）：nginx 负载均衡入口——单机双实例滚动重启演练用。
#
# 拓扑与选型说明见同目录 README.md；与演练脚本的配合：
#   scripts/stability/lb-rolling-drill.sh 起 A/B 两实例（宿主机 java，18091/18092）
#   → 起本 nginx（compose profile lbe2e）→ 流量全打 http://127.0.0.1:8080。
#
# 这是**单机模拟**：nginx 在容器里、应用实例在宿主机（不把应用容器化——那是
# 5D Dockerfile 的事，本刀只补"经 LB 的生产形态"：摘流量/回池/故障转移）。

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # 带 $upstream_addr 的访问日志：排障"哪个请求打到了哪个实例/有没有重试"的
    # 第一手证据（演练假红时用它定位，比从响应头反推可靠）。
    log_format drill '$time_iso8601 "$request" $status up=$upstream_addr rt=$request_time';
    access_log /dev/stdout drill;

    # ------------------------------------------------------------------
    # 上游：宿主机上的两个应用实例。
    # 容器访问宿主用 host.docker.internal——Linux Docker 没有这个自动解析，
    # compose 里用 extra_hosts: "host.docker.internal:host-gateway" 把它指到
    # 宿主网关 IP（2026-11-10 实测：容器 → 宿主 java 18091/18092 可达）。
    # ------------------------------------------------------------------
    upstream newcoupon {
        # 被动健康摘除（开源 nginx 无主动探测）：max_fails=1 fail_timeout=30s——
        # 一次失败（连接错误/超时/被 proxy_next_upstream 认定的失败码）后，
        # 该实例 30 秒内不再被路由。
        #
        # drain 摘流量靠它生效：drain 后实例的 /actuator/health 返回 503，
        # 演练脚本每秒经 LB 打一次 health（模拟 K8s/HAProxy 那类主动探测），
        # 探测打到被摘实例 → 503 → 计一次失败 → 实例出池。
        #
        # fail_timeout=30s（不是常见的 10s）：与"drain → 确认摘除 → SIGTERM →
        # 重启完成"的整段窗口对齐——窗口内实例不会因超时提前回池；实例真恢复
        # 后（端口通 + health UP），下一次路由到它的请求成功即回池。
        server host.docker.internal:18091 max_fails=1 fail_timeout=30s;
        server host.docker.internal:18092 max_fails=1 fail_timeout=30s;

        # 上游连接池（生产最佳实践，在本环境另有硬理由）：容器→宿主的
        # host-gateway 代理对新连接有 ~0.25% 的随机停滞率（2026-11-10 实测：
        # 隔离环境 2500 次新建连接 6 次停滞 >12s）——每请求新建连接等于每请求
        # 抽一次签，抽中就是一次 connect 超时 → 被动摘除误伤。keepalive 池把
        # "建连接"从每请求一次降到每连接几万次请求一次，抽签次数趋近于零。
        # 必须配套 location 里的 proxy_http_version 1.1 + Connection ""。
        keepalive 16;
    }

    server {
        listen 8080;

        # 每个响应盖上"实际由哪个 upstream 服务"（重试时是逗号分隔的尝试列表，
        # 最后一项才是真正服务的实例）。演练用它断言"被摘实例不再出现在成功分布"。
        add_header X-Served-By $upstream_addr always;

        location / {
            proxy_pass http://newcoupon;
            proxy_http_version 1.1;
            # Connection 置空是 upstream keepalive 的必要配套（默认 hop-by-hop 头
            # 会带着 "close" 过去，连接用完即断，池就废了）
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 连接超时 10s（不是常见的 3s 快速失败）：容器→宿主走 Docker Desktop 的
            # host-gateway 用户态代理，实测会在持续负载下出现 ~4-8s 的 SYN 停滞
            # （2026-11-10 三轮演练：停滞期内对监听端口的 connect 静默掉包）。3s 超时
            # 会把可自愈的停滞放大成"双实例同时判死 → no live upstreams → 502 洪峰"；
            # 10s 预算让停滞内的 SYN 重传最终连上，请求只是变慢不是失败。
            # 死实例检测不受此拖累：端口关闭是 RST 秒拒（不是丢包），且本编排里
            # SIGTERM 前实例已被 drain 摘除——LB 从 503 学会摘除，不靠连接失败。
            proxy_connect_timeout 10s;
            # 读/写超时**略大于应用 graceful 30s**（spring lifecycle timeout）：
            # 排空中的实例可能要处理完整批在途请求才响应，LB 若比应用先超时，
            # 会把"还在处理"的请求判死并重试到另一台——那是双发的入口。
            proxy_send_timeout 31s;
            proxy_read_timeout 31s;

            # 故障转移：连接错误/超时/502/503/504 换下一台，最多再试 1 台
            #（两实例集群，第二台就是最后防线）。
            #
            # **故意不开 non_idempotent**：POST（领券）一旦已经发给后端就不再重试——
            # LB 层无从知道后端是否已受理，盲目重试会造成双发（一个 requestId
            # 领两张券）；幂等性由应用层的 requestId 幂等键兜底，这是有意识的取舍。
            # 连接阶段失败（请求还没发出去）仍会换台，不构成双发。
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            # 故障转移总预算 25s：盖住最坏路径"第一台连接超时 10s + 第二台连接/响应"，
            # 同时小于客户端 30s 请求超时（客户端比 LB 先放弃会把在途请求记成 reset）
            proxy_next_upstream_timeout 25s;
        }
    }
}
