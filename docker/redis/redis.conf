# Redis 部署参数基线（A2，2026-09-16 大厂审查落地——此前红线声称"日限敞口靠
# noeviction+主从写安全参数收窄"但无可部署实体）
#
# ── 逐出策略：禁逐出 ──
# 领券闸门的计数键（ul/uld/dly/stk）是正确性数据不是缓存——逐出=失忆=日限敞口。
# noeviction：内存满时写命令报错（快速失败、可被对账发现），绝不静默丢数据。
maxmemory 1gb
maxmemory-policy noeviction

# ── 持久化：AOF ──
# RDB 快照故障切换时丢分钟级写；AOF everysec 最多丢 1 秒——把"丢计数"窗口
# 从分钟级收窄到秒级（丢失数=敞口上界）。
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── 主从写安全参数（M4 哨兵部署时启用——单实例下启用会拒绝所有写！）──
# min-replicas-to-write 1
# min-replicas-max-lag 10

# ── 慢日志（G 组流量治理：慢命令可见性）──
slowlog-log-slower-than 10000
slowlog-max-len 256
