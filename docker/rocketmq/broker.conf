# P2d：单机最小 broker（学习项目形态——生产是多主多从/Dledger，见 docs/ROADMAP P6）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 容器经典坑：不写 brokerIP1，客户端从 namesrv 拿到的是容器内网 IP，宿主机连不上
brokerIP1 = 127.0.0.1
autoCreateTopicEnable = true
